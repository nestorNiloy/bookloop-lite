name: BookLoop Lite CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Refresh backend lockfile
        working-directory: backend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=low
      - name: Run backend integration tests
        working-directory: backend
        run: npm test

      - name: Refresh frontend lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update vulnerable dependency lockfiles"
            git push origin HEAD
          fi
